<div class="sidebar" cdkDropList #sourceList="cdkDropList" [cdkDropListConnectedTo]="[targetList]">
  <!-- Upload Document Button -->
  <div style="padding: 10px; border-bottom: 1px solid #ddd;">
    <label for="fileInput" style="display: block; margin-bottom: 10px; font-weight: bold; cursor: pointer;">
      📄 Chọn Document
    </label>
    <input 
      type="file" 
      id="fileInput" 
      #fileInput
      accept=".docx,.doc,.xlsx,.xls,.pptx,.ppt"
      (change)="onFileSelected($event)"
      style="display: none;">
    <button 
      type="button"
      (click)="fileInput.click()"
      style="width: 100%; padding: 8px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Chọn File
    </button>
    <div *ngIf="selectedFileName" style="margin-top: 5px; font-size: 12px; color: #666;">
      File: {{ selectedFileName }}
    </div>
  </div>

  <!-- Item text - Click hoặc kéo thả để chèn vào document -->
  <div class="drag-item" 
       *ngFor="let p of properties" 
       cdkDrag 
       [cdkDragData]="{type: 'text', content: p.code}"
       (cdkDragStarted)="onDragStarted(p)"
       (click)="onItemClick(p)"
       style="cursor: pointer; padding: 8px; margin: 4px; background: #f5f5f5; border-radius: 4px; border: 1px solid #ddd; transition: all 0.2s;"
       [style.background]="'#f5f5f5'"
       (mouseenter)="$event.target.style.background='#e0e0e0'"
       (mouseleave)="$event.target.style.background='#f5f5f5'">
    📋 {{ p.code }}
    <span *cdkDragPreview style="background: #4CAF50; color: white; padding: 4px 8px; border-radius: 4px;">
      {{ p.code }}
    </span>
  </div>
  
  <div style="padding: 10px; font-size: 11px; color: #888; border-top: 1px solid #ddd; margin-top: 10px;">
    💡 Click vào item để chèn vào vị trí con trỏ trong document
  </div>

  <!-- Download Section -->
  <div style="padding: 10px; border-top: 1px solid #ddd; margin-top: 10px;">
    <label style="display: block; margin-bottom: 10px; font-weight: bold;">
      💾 Lưu Document
    </label>
    <button 
      type="button"
      (click)="saveDocument()"
      style="width: 100%; padding: 10px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-bottom: 8px;">
      📥 Download DOCX
    </button>
    <button 
      type="button"
      (click)="downloadAsPdf()"
      style="width: 100%; padding: 10px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">
      📄 Download PDF
    </button>
  </div>
</div>
